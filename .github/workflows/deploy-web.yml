name: Deploy Web App

on:
  push:
    branches:
      - main
      - valderrama-fixforward-wrapper-migration
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test patcher
        run: npm --prefix textdb test

      - name: Assemble the browser patcher
        run: |
          (cd textdb/assets && sha256sum -c SHA256SUMS)
          mkdir -p dist/assets
          cp -r textdb/index.html textdb/styles.css textdb/*.png textdb/src dist/
          tail -n +3 src/index.css > dist/legacy-base.css
          cp src/App.css dist/legacy-layout.css
          cp textdb/assets/pm99-core.{js,wasm} dist/assets/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
